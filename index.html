<body>
  <div id="toast" class="toast"></div>

  <section id="auth-view" class="auth-shell" aria-labelledby="login-title">
    <div class="auth-card glass">
      <div class="brand-mark">♡</div>
      <p class="eyebrow">PRIVATE • JUST FOR US</p>
      <h1 id="login-title">Our Little World</h1>
      <p class="muted">Two hearts. One little space.</p>
      <form id="login-form">
        <fieldset class="login-profile-picker">
          <legend>Choose your profile</legend>
          <div class="login-profile-options">
            <button class="login-profile-option" type="button" data-profile="kebyy" aria-pressed="false">
              <span class="login-profile-photo"><span data-login-profile-fallback aria-hidden="true">K</span><img data-login-profile-image="kebyy" alt=""><span class="verified-badge" role="img" aria-label="Verified profile"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 10.2 3.1 3.1L15.3 6"/></svg></span></span>
              <span>Keby</span>
            </button>
            <button class="login-profile-option" type="button" data-profile="shazy" aria-pressed="false">
              <span class="login-profile-photo"><span data-login-profile-fallback aria-hidden="true">S</span><img data-login-profile-image="shazy" alt=""><span class="verified-badge" role="img" aria-label="Verified profile"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 10.2 3.1 3.1L15.3 6"/></svg></span></span>
              <span>Shazy</span>
            </button>
          </div>
        </fieldset>
        <input id="login-user" type="hidden" value="">
        <input id="login-email" type="text" autocomplete="username" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
        <label id="login-password-label" class="login-password-label hidden">6-digit PIN<input id="login-password" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" enterkeyhint="go" placeholder="6-digit PIN" aria-label="6-digit PIN" disabled></label>
        <button id="login-submit" class="primary full hidden" type="submit" disabled>Enter our world ♡</button>
      </form>
      <p id="auth-error" class="error" role="alert" aria-live="polite"></p>
    </div>
    <nav class="public-legal-links" aria-label="Legal information">
      <a href="privacy-policy.html">Privacy Policy</a>
      <span aria-hidden="true">·</span>
      <a href="terms-of-service.html">Terms of Service</a>
    </nav>
  </section>

  <section id="app-view" class="hidden">
    <header class="topbar">
      <div class="top-brand">
        <div class="brand-mark top-logo">♡</div>
        <div>
          <p class="eyebrow">OUR LITTLE WORLD</p>
          <h2 id="page-title">Dashboard</h2>
        </div>
      </div>
      <div class="top-actions">
        <div id="partner-presence" class="avatar-container" title="Partner Status"></div>
        <div id="notification-center"></div>
        <button id="profile-btn" class="avatar" type="button" title="Profile" aria-label="Open profile"><span id="avatar-letter">♡</span></button>
      </div>
    </header>

    <main id="main-content" class="content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-route="home" aria-label="Home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
      <button type="button" data-route="memories" aria-label="Memories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg><span>Memories</span><i class="nav-badge" aria-hidden="true"></i></button>
      <button type="button" data-route="games" aria-label="Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8h11a4 4 0 0 1 3.8 2.8l1.1 3.8a2.7 2.7 0 0 1-4.4 2.8l-2.5-2.1h-7l-2.5 2.1a2.7 2.7 0 0 1-4.4-2.8l1.1-3.8A4 4 0 0 1 6.5 8Z"/><path d="M7 10.5v4M5 12.5h4M16.5 11.5h.01M19 14h.01"/></svg><span>Games</span></button>
      <button type="button" data-route="gallery" aria-label="Post"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M7 3h10M5 5h14M7 17l3.5-4 2.5 2 2.5-3 3.5 5"/><circle cx="9" cy="10" r="1"/></svg><span>Post</span><i class="nav-badge" aria-hidden="true"></i></button>
      <button type="button" data-route="letters" aria-label="Letters"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6 9 7 9-7"/></svg><span>Letters</span><i class="nav-badge" aria-hidden="true"></i></button>
      <button type="button" data-route="more" aria-label="More"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="12" cy="19" r="2"/></svg><span>More</span><i class="nav-badge" aria-hidden="true"></i></button>
    </nav>
    <div id="partner-chat-root"></div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
